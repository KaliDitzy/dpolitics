l_english:
  election.1.t: "Election Stalled"
  election.1.d: "The elections have resulted in an unprecedented tie, leaving no conclusive victor. We will be forced to form a coalition with other parties to resolve this conflict."
  election.1.a: "Oh dear."
  election.2.t: "Fascists Secure Election"
  election.2.d.1: "We have managed to achieve the plurality of the vote from the [ROOT.GetAdjective] people. It is recommended for us to form a coalition so we may have the decision-making power to proceed with our goals. Otherwise, I believe the rest of the government may challenge us, and we will not receive their good will."
  election.2.d.2: "We have managed to achieve the majority of the vote and guarantee our dominance over the [ROOT.GetAdjective] government. However, the rest of those in government will grow to despise our dominance. It could be in our best interests to form a coalition despite our supermajority to earn their good will."
  election.2.a: "We shall form a coalition."
  election.2.b: "A minority government is preferable."
  election.2.c: "We will keep our comfortable majority."
  election.2.d: "We believe they've earned a coalition."
