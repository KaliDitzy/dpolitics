  politics.opposition.1.t: "Anti-Fascists Rally in [ROOT.capital.GetCapitalVictoryPointName]"
  politics.opposition.1.a: "Scum!"
  politics.opposition.1.b: "What would they know?"
  politics.opposition.2.t: "Progressive Rally in [ROOT.capital.GetCapitalVictoryPointName]"
  politics.opposition.2.a: "We must stick to tradition!"
  politics.opposition.2.b: "They go against our very way of life."
  politics.opposition.3.t: "Progressive Speech in [ROOT.capital.GetCapitalVictoryPointName]"
  politics.opposition.3.a: "The old ways are the best ways!"
  politics.opposition.3.b: "They go against our very way of life."
  politics.opposition.4.t: "Conservative Speech in [ROOT.capital.GetCapitalVictoryPointName]"
  politics.opposition.4.a: "Every man is created equal!"
  politics.opposition.4.b: "It's possible they have a few points..."
  politics.opposition.5.t: "Support for Centralization in [ROOT.capital.GetCapitalVictoryPointName]"
  politics.opposition.5.a: "The market speaks for itself!"
  politics.opposition.5.b: "The market speaks for itself..."
  politics.opposition.6.t: "Anti-Socialist Speech in [ROOT.capital.GetCapitalVictoryPointName]"
  politics.opposition.6.a: "The nation must serve its people!"
  politics.opposition.6.b: "We will not tolerate leeches."
  politics.opposition.7.t: "Revolutionary Speech in [ROOT.capital.GetCapitalVictoryPointName]"
  politics.opposition.7.a: "Reform is the best way!"
  politics.opposition.7.b: "I wish it was that easy..."
  politics.opposition.8.t: "Anti-Bolshevik Rally in [ROOT.capital.GetCapitalVictoryPointName]"
  politics.opposition.8.a: "Class traitors!"
  politics.opposition.8.b: "It is their life."
  politics.opposition.9.t: "Statists Gather in [ROOT.capital.GetCapitalVictoryPointName]"
  politics.opposition.9.a: "Have they ever owned capital?"
  politics.opposition.9.b: "Perhaps I, too, yearn for the past."

  politics.regime_change.1.t: "The [FROM.GetAdjective] Kingdom is formed!"
  politics.regime_change.2.t: "The [FROM.GetAdjective] Republic is formed!"
  politics.regime_change.3.t: "The [FROM.GetAdjective] Junta comes to power!"
  politics.regime_change.4.t: "The [FROM.GetAdjective] Commune is formed!"
  politics.regime_change.5.t: "The [FROM.GetAdjective] Soviet Republic is formed!"

  deutscher_bund.1.t: "Die Deitschnation"
  deutscher_bund.2.t: "Aufruf zur Einigung"
  deutscher_bund.2.a: "The time has come to join as one."
  deutscher_bund.2.b: "We cannot commit to such a union."
  deutscher_bund.3.t: "Germany Unites!"